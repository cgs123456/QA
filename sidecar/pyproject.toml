[project]
name = "interview-copilot-sidecar"
version = "0.1.0"
description = "InterviewCopilot Python sidecar (health + Bearer auth; task-2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
