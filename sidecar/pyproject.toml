[project]
name = "interview-copilot-sidecar"
version = "0.1.0"
description = "InterviewCopilot Python sidecar (local-first RAG + answers)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # uvicorn 需要显式 WS 实现：ws="auto" 缺 websockets/wsproto 时不会降级，
    # 而是对 /audio/stream 的升级请求直接 404（task-14 实测）。
    "websockets>=13",
    "httpx>=0.27",
    # P1 格式导入：Excel 解析（openpyxl，纯 Python）+ PDF 文本提取（pypdf，
    # 纯 Python；刻意不用 pdfplumber——它拖 Pillow/pdfminer，原生依赖进
    # PyInstaller onedir 包是体积与签名风险，见 pdf_parser.py 选型注释）。
    "openpyxl>=3.1",
    "pypdf>=6",
    "sqlite-vec>=0.1",
    "onnxruntime>=1.17",
    "transformers>=4.40",
    # 本地 ASR（task15）：base 档 int8 CPU。权重不进包，经 registry 下载器按
    # SHA256 落盘（sidecar/models/faster-whisper-base）。
    "faster-whisper>=1.0",
    # 多 ASR Provider（task17）：SenseVoice + Paraformer 经 sherpa-onnx（ONNX，
    # 免 torch）。选型结论：funasr 拖 PyTorch（~2 GB），sherpa-onnx 两个 wheel
    #（sherpa-onnx + sherpa-onnx-core）合计约 18 MiB —— 体积差两个数量级。
    # 实测版本 1.13.8（`OfflineRecognizer.from_sense_voice/from_paraformer`）。
    "sherpa-onnx>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# task19 回归测量专用（不进主锁文件、不进包）：VAD 对比双 provider 适配器用。
# CI/回归机：pip install -e ./sidecar[audio-eval]
audio-eval = ["webrtcvad-wheels>=2.0", "silero-vad>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
