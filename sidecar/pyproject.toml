[project]
name = "interview-copilot-sidecar"
version = "0.1.0"
description = "InterviewCopilot Python sidecar (local-first RAG + answers)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlite-vec>=0.1",
    "onnxruntime>=1.17",
    "transformers>=4.40",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
