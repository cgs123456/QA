[package]
name = "interview-copilot"
version = "0.1.0"
description = "InterviewCopilot - internal, local-first desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "interview_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# F1.6 全局快捷键：开始/停止采集 + 手动触发提词。
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
keyring = "2"
reqwest = { version = "0.12", features = ["json"] }
cpal = "0.18.2"
rubato = "5.0.0"
webrtc-vad = "0.4.0"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"

# 注入测试台读 WAV 用（`SyntheticSource::from_wav`）。可选：不打开
# `audio-testharness` 时生产构建里根本没有 hound。
hound = { version = "3.5.1", optional = true }

[features]
default = []
# 注入测试台：`audio::synthetic`（SyntheticSource）+ `examples/inject_wav` +
# `tests/inject_e2e.rs`。**只给 dev/example**，不进生产构建。
audio-testharness = ["dep:hound"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5.1"
# 端点 fixture 的样本指纹（scripts/gen_endpoint_fixture.py 同算法）。
sha2 = "0.10"

# 注入人工走查工具：`cargo run --features audio-testharness --example inject_wav
# -- --wav testdata/synth_utterance_zh.wav --path loopback --realtime`
# 需要 feature 才编（它依赖 `audio::synthetic`），否则默认 `cargo build --examples`
# 会因为找不到模块而失败。
[[example]]
name = "inject_wav"
required-features = ["audio-testharness"]

# 注入 E2E 与 `SyntheticSource` 同源，所以同样需要 feature。
# 不带 feature 时 `cargo test` 直接跳过这个二进制（而不是编译失败）。
[[test]]
name = "inject_e2e"
required-features = ["audio-testharness"]
