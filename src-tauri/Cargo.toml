[package]
name = "interview-copilot"
version = "0.1.0"
description = "InterviewCopilot - internal, local-first desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "interview_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# taskP7：`tray-icon` 是托盘能力（非默认 feature）；`image-png`/`image-ico` 给
# `tauri::include_image!` 解码托盘图标用（`Image::from_bytes` 受这两个 feature 门控）。
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
# F1.6 全局快捷键：开始/停止采集 + 手动触发提词。
tauri-plugin-global-shortcut = "2"
# taskP7：开机自启开关（Settings 面板）。注册失败不阻断启动。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Linux 加密文件 key 回退的 HKDF-CTR+HMAC-SHA256 构造（F6.3 Phase 2，P8）。
# 此前在 dev-dependencies（端点 fixture 指纹用）；现为正式依赖——
# Cargo.lock 零新增 crate（同版本 0.10，仅改依赖边），不算引入新依赖。
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
keyring = "2"
reqwest = { version = "0.12", features = ["json"] }
cpal = "0.18.2"
rubato = "5.0.0"
webrtc-vad = "0.4.0"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
# S8：二维码生成（本地 WS 伴侣连接码）
qrcode = "0.14"
# S8：本地 IP 获取
local-ip-address = "0.6"
# S8：随机数生成（token）
rand = "0.8"
# S8：Base64 编码（token URL-safe）
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"
# taskP7：`SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE)` —— 提词窗不进屏幕捕获。
# 只用到这两个 feature；`HWND` 在本 crate 里就是 `*mut c_void`，与 tauri 的
# `window.hwnd()` 返回的 `windows::HWND(pub *mut c_void)` 可以裸指针直传。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# 注入测试台读 WAV 用（`SyntheticSource::from_wav`）。可选：不打开
# `audio-testharness` 时生产构建里根本没有 hound。
hound = { version = "3.5.1", optional = true }

[features]
default = []
# 注入测试台：`audio::synthetic`（SyntheticSource）+ `examples/inject_wav` +
# `tests/inject_e2e.rs`。**只给 dev/example**，不进生产构建。
audio-testharness = ["dep:hound"]


# 2026-09-16 磁盘体检：dev 默认 `debug = 2`，每个 crate 都产出完整 pdb，
# `target/debug/deps/*.pdb` 堆到 7.3G（同名 crate 最多残留 9 份旧 hash）。
# `line-tables-only` 只保留行号表——panic 与断点仍带行号，pdb 体积降一个数量级。
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
hound = "3.5.1"

# 注入人工走查工具：`cargo run --features audio-testharness --example inject_wav
# -- --wav testdata/synth_utterance_zh.wav --path loopback --realtime`
# 需要 feature 才编（它依赖 `audio::synthetic`），否则默认 `cargo build --examples`
# 会因为找不到模块而失败。
[[example]]
name = "inject_wav"
required-features = ["audio-testharness"]

# 注入 E2E 与 `SyntheticSource` 同源，所以同样需要 feature。
# 不带 feature 时 `cargo test` 直接跳过这个二进制（而不是编译失败）。
[[test]]
name = "inject_e2e"
required-features = ["audio-testharness"]

# S8 伴侣单测（无需 audio-testharness）。
[[test]]
name = "companion_test"
